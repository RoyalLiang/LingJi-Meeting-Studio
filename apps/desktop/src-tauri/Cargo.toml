[package]
name = "tts-client"
version = "0.1.30"
description = "TTS desktop client with native audio capture"
edition = "2021"
rust-version = "1.90"

[build-dependencies]
tauri-build = { version = "=2.7.2", features = [] }

[dependencies]
tempfile = "=3.23.0"
tauri = { version = "=2.12.3", features = ["macos-private-api"] }
tauri-plugin-dialog = "=2.8.2"
tauri-plugin-updater = "=2.13.3"
cpal = "=0.18.2"
rubato = "=0.16.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
url = "2"
axum = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "cookies"] }
tokio = { version = "1", features = ["net", "sync", "rt", "macros"] }
fs2 = "0.4"
getrandom = "0.3"
subtle = "2"

[dev-dependencies]
futures-util = "0.3"

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
tauri = { version = "=2.12.3", features = ["tray-icon"] }
tauri-plugin-single-instance = "=2.5.4"

[target.'cfg(target_os = "linux")'.dependencies]
cpal = { version = "=0.18.2", features = ["pipewire"] }

[features]
smoke-test = []

[profile.release]
codegen-units = 1
lto = "thin"
strip = true
