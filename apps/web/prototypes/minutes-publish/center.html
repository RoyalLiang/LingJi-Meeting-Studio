<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>聆记 · 扩展</title>
  <link rel="stylesheet" href="./center.css">
</head>
<body>
<a class="skip-link" href="#center">跳到内容</a>
<div class="app-shell">
  <aside class="app-nav">
    <a class="wordmark" href="./center.html"><img src="../../../desktop/assets/lingji-brand-mark.svg" width="30" height="30" alt=""><b>聆记</b></a>
    <div class="space-picker"><span>产品与设计</span><span aria-hidden="true">⌄</span></div>
    <nav aria-label="主导航">
      <a class="nav-link" href="./?screen=meeting" aria-label="全部会议" title="全部会议"><span data-icon="meeting"></span><span>全部会议</span></a>
      <button class="nav-link" data-view="assistant" aria-label="会议助手" title="会议助手"><span data-icon="chat"></span><span>会议助手</span></button>

</div>
<dialog id="center-dialog" aria-labelledby="dialog-title"></dialog>
<div id="center-toast" role="status" aria-live="polite" hidden></div>
<script type="module" src="./center.mjs"></script>
