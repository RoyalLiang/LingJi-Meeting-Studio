<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Live Share Viewer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet" />
    <style>
      body {
        margin: 0;
        font-family: "Noto Sans SC", "Manrope", sans-serif;
        background:
          radial-gradient(circle at top left, rgba(125, 211, 252, 0.18), transparent 24%),
          radial-gradient(circle at top right, rgba(253, 224, 71, 0.14), transparent 18%),
          linear-gradient(180deg, #071019 0%, #091922 52%, #06131a 100%);
        color: #f8fafc;
      }
      main {
        max-width: 980px;
        margin: 0 auto;
        padding: 32px 18px 40px;
      }
      .panel {
        position: relative;
        overflow: hidden;
        background: linear-gradient(180deg, rgba(255,255,255,0.11), rgba(255,255,255,0.05));
        border: 1px solid rgba(255,255,255,0.1);
        border-radius: 28px;
        padding: 24px;
        box-shadow: 0 28px 72px rgba(0, 0, 0, 0.34);
        backdrop-filter: blur(24px) saturate(145%);
      }
      .panel::before {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
        background:
          radial-gradient(circle at top left, rgba(125, 211, 252, 0.14), transparent 32%),
          linear-gradient(145deg, rgba(255,255,255,0.08), transparent 46%, rgba(148,163,184,0.08));
      }
      .panel > * { position: relative; z-index: 1; }
      h1 {
        margin: 0;
        font-family: "Space Grotesk", "Noto Sans SC", sans-serif;
        font-size: clamp(30px, 4vw, 48px);
        line-height: 0.98;
        letter-spacing: -0.05em;
      }
      #status {
        margin: 16px 0 0;
        display: inline-flex;
        align-items: center;
        gap: 10px;
        padding: 9px 14px;
        border-radius: 999px;
        border: 1px solid rgba(255,255,255,0.1);
        background: rgba(255,255,255,0.07);
        color: rgba(226, 232, 240, 0.72);
        font-size: 12px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }
      #status::before {
        content: "";
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: linear-gradient(135deg, #67e8f9, #86efac);
        box-shadow: 0 0 16px rgba(103,232,249,0.4);
      }
      #segments {
        display: grid;
        gap: 16px;
        margin-top: 26px;
        padding-left: 28px;
        position: relative;
      }
      #segments::before {
        content: "";
        position: absolute;
        left: 12px;
        top: 8px;
        bottom: 8px;
        width: 1px;
        background: linear-gradient(180deg, rgba(110,231,183,0.35), rgba(148,163,184,0));
      }
      .segment {
        position: relative;
        padding: 16px 16px 16px 18px;
        border-radius: 22px;
        border: 1px solid rgba(255,255,255,0.08);
        background: linear-gradient(180deg, rgba(255,255,255,0.1), rgba(255,255,255,0.06));
        box-shadow: 0 18px 40px rgba(0, 0, 0, 0.18);
      }
      .segment::before {
        content: "";
        position: absolute;
        left: -22px;
        top: 18px;
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: linear-gradient(135deg, #67e8f9, #86efac);
        box-shadow: 0 0 0 5px rgba(103,211,252,0.12);
      }
      .translation {
        color: rgba(209,250,229,0.92);
        margin-top: 10px;
        padding: 12px 14px;
        border-radius: 16px;
        background: linear-gradient(135deg, rgba(45,212,191,0.12), rgba(255,255,255,0.05));
        line-height: 1.7;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="panel">
        <h1 id="title">Live Share Viewer</h1>
        <p id="status">正在加载...</p>
        <div id="segments"></div>
      </div>
    </main>
    <script type="module" src="/viewer.js"></script>
  </body>
</html>
