<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>发布会议纪要 · 聆记</title><link rel="stylesheet" href="/site.css"><script type="module" src="/publish.js"></script></head><body><header class="site-nav wrap"><a class="wordmark" href="/">聆记 <span class="latin">LingJi</span></a><a href="/example">阅读示例纪要 ↗</a></header><main class="publisher wrap"><h1>发布一份会议纪要</h1><p class="intro">在桌面版的“分享会议”中导出在线分享文件，再在这里预览。确认后生成 24 小时有效的只读链接，原音不会上传。发布使用 GitHub 登录，目前仅向 RoyalLiang 开放，不申请仓库或邮箱权限。</p><p id="service-status" class="status" role="status">正在确认发布服务…</p><p><a id="publisher-login" class="button" href="/auth/login">使用 GitHub 登录</a></p><form id="publisher-logout" action="/auth/logout" method="post" hidden><button class="ghost">退出发布账户</button></form><form id="publish-form"><div class="upload"><label for="content-file">选择共享内容文件</label><input id="content-file" type="file" accept=".json,application/json" required><p>仅接受聆记导出的 .lingji.json 文件，最大 1 MiB。</p></div><p id="selection" class="status" role="status"></p><iframe id="preview" class="publish-preview" title="发布内容预览" sandbox="" hidden></iframe><label class="consent"><input id="consent" type="checkbox" required><span>我已核对完整预览，确认将所选内容发布给持有链接的人。撤销无法收回他人已经保存的副本。</span></label><button id="publish-button" class="button" disabled>确认发布并生成链接</button><p id="message" class="status" role="status" aria-live="polite"></p></form><section id="result" class="share-result" hidden><h2>只读链接已生成</h2><label for="share-url">分享链接</label><input id="share-url" readonly><div class="actions"><button id="copy-link" class="ghost">复制链接</button><a id="open-link" href="/" target="_blank" rel="noopener noreferrer">打开纪要 ↗</a></div><p id="expires"></p></section><section class="history"><h2>管理已发布链接</h2><p>撤销会阻止后续访问，并从当前数据库中移除正文。删除本机会议不会自动撤销这些链接。</p><button id="refresh-shares" class="ghost">刷新列表</button><p id="history-status" class="status" role="status"></p><div id="history-list"></div></section></main></body></html>
