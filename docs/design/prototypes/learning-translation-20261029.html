function translatedItem(i){return `<article class="translation-item"><header><span>说话人 1</span><time class="mono">${i===0?'03:02':'03:18'}</time></header><p class="source">${originals[i]}</p><p class="target" lang="en">${targets[i]}</p></article>`}
function translation(){let paused=state==='paused',error=state==='error',unconfigured=state==='unconfigured',reading=state==='reading';return `<div class="shell">${shellTop()}<div class="translation-shell"><main class="record">${recordCard()}${minutes()}</main><aside class="translation-pane" aria-label="实时翻译"><header class="translation-header"><h2>${icon('translate')}实时翻译</h2>${closeButton('关闭翻译面板')}</header><div class="translation-tools"><div class="lang-switch"><select aria-label="原文语言"><option>自动识别</option><option>中文</option></select>${icon('chevron')}<select aria-label="目标语言"><option>English</option><option>中文</option><option>日本語</option></select><button class="icon ${paused?'primary':''}" data-action="translation-toggle" aria-label="${paused?'继续翻译':'暂停翻译'}" ${unconfigured?'disabled':''}>${icon(paused?'play':'pause')}</button></div><div class="translation-line">${tag(unconfigured?'未配置':paused?'翻译已暂停':error?'部分翻译待重试':'实时翻译中',unconfigured||error?'warning':'')}<label><input type="checkbox" id="show-source" ${original?'checked':''}>显示原文</label></div></div>${state==='history'?'<div class="backlog">历史补译 · 已完成 18 / 44 条<button data-action="livefirst">新发言优先</button></div>':''}<div class="translation-scroll ${original?'':'source-hidden'}">${unconfigured?`<div class="translation-empty"><div class="status-emblem">${icon('translate')}</div><h3>连接翻译服务</h3><p class="muted" style="font-size:12px">配置可用服务后，即可开始实时翻译。</p><button class="primary" data-action="configure">打开模型设置</button></div>`:`${paused?'<div class="pause-banner"><span>翻译已暂停，已有译文保留。</span><button data-state="live">继续翻译</button></div>':''}${translatedItem(0)}${translatedItem(1)}${error?`<article class="translation-item"><header><span>说话人 1</span><time>03:35</time></header><p class="source">这部分性能结果还需要通过真实工作负载进一步核对。</p><div class="pause-banner"><span style="color:var(--warn)">本句翻译失败</span><button data-action="retry">${icon('retry')}重试本句</button></div></article>`:!paused?`<article class="translation-item live"><div class="live-label"><i class="dot"></i>正在发言<span>临时译文</span></div><p class="source" style="margin-top:10px">不过，软件兼容性也会影响实际的…</p><p class="target" lang="en">However, software compatibility can also affect the actual…</p><small style="font-size:10px;display:block;margin-top:10px">随实时原文更新，确认后归入上方记录</small></article>`:''}`}</div><footer class="translation-bottom"><span class="muted">${unconfigured?'等待连接翻译服务':paused?'已暂停 · 18 条译文已保留':error?'17 条已完成 · 1 条待重试':state==='history'?'正在补译历史 · 不阻塞新发言':reading?'已暂停跟随 · 有新译文':'跟随最新 · 18 条已完成'}</span>${reading?'<button class="primary" data-state="live">回到最新译文</button>':!unconfigured&&!paused?'<button class="ghost" data-state="reading">暂停跟随</button>':''}</footer></aside></div></div>`}
function share(){return `<div class="shell">${shellTop()}<main class="record">${recordCard()}${minutes()}</main><div class="overlay"><section class="modal sharemodal" role="dialog" aria-modal="true" aria-label="分享会议"><header class="modal-head row between"><h2>分享会议</h2>${closeButton()}</header><div class="share-content"><h3>RTXSpark 笔记本实测</h3><div class="share-preview"><div class="share-preview-title">分享预览</div><div class="share-preview-body"><h4>硬件与本地 AI 表现</h4><p>本轮测试关注理论性能、游戏表现、续航与本地 AI 能力。</p><p>大容量模型的完整载入与推理速度，是本轮的重要评估内容。</p></div></div><button class="primary" data-action="export">${icon('download')}导出分享文件</button></div></section></div></div>`}
function flow(){const cards=[['服务自动探测',tag('服务不可用','warning'),'入口禁用，悬停说明原因。后台探测恢复后自动启用；探测中也不可触发生成或训练。','learning','offline','查看入口状态'],['准备待标注',tag('后台准备'),'先冻结版本并生成可核听的基础片段；对照候选随后补充。已打开的标注输入不被刷新覆盖。','learning','preparing','查看准备状态'],['核听与标注',tag('18 / 44 已完成'),'逐段核听、选择转录、标注意图；无法确定可跳过。保存成功后进入下一段。','learning','review','打开标注工作区'],['确认训练计划',tag('需要人工确认'),'显示实际样本、训练 / 验证 / 测试分组。未保存、未核听、版本失效的标签不得训练。','learning','plan','查看训练确认'],['训练与回测',tag('后台进行中'),'阶段来自后台真实状态。服务中断保留已保存结果；失败可查看原因，按新轮次重试。','learning','training','查看训练状态'],['回看结果',tag('不自动启用模型'),'展示上一轮与本轮差异及样本基数。缺少独立测试时明确说明，不把训练拟合当质量证明。','learning','result','查看回测结果']];const tCards=[['跟随实时原文',tag('实时翻译中'),'最新发言优先；实时原文和临时译文同组展示。原文修订后丢弃过期译文，确认后稳定归档。','translation','live','查看实时翻译'],['暂停与历史补译',tag('独立控制'),'“暂停翻译”停止新请求；“暂停跟随”只停滚动。补译历史不挡住新发言，已完成译文保留。','translation','history','查看补译状态'],['失败、离线与恢复',tag('局部失败','warning'),'单句失败原位重试；未配置服务时显示设置入口。切换语言隔离旧请求，原文始终可查。','translation','error','查看失败恢复']];const card=([title,status,desc,sec,st,action])=>`<article class="flowcard"><header><h3>${title}</h3>${status}</header><div class="mini-window">${desc}</div><button data-jump="${sec}:${st}">${action}${icon('chevron')}</button></article>`;return `<div class="flowboard"><header class="board-title"><div><h1>学习评审与实时翻译 · 全流程设计</h1><p>统一弹窗与侧栏；原会议、人工标注、模型训练结果各自保留。</p></div><span class="tag">待你确认 · 非已实现功能</span></header><div class="board-section"><h2>学习评审</h2><small>自动探测 → 准备 → 标注 → 人工确认 → 训练回测 → 结果</small></div><div class="flowgrid">${cards.map(card).join('')}</div><div class="board-section" style="margin-top:32px"><h2>实时翻译</h2><small>双语对照 · 临时译文与已确认译文区分 · 新发言优先</small></div><div class="flowgrid">${tCards.map(card).join('')}</div><div class="board-note"><strong>本轮其余两项：</strong>分享预览仅含纪要，去掉说明性小字、草稿标签与共享转录；原音进度条保持既有外观，重点核对时钟回跳与波形层闪烁。<br>本页状态、数量与指标均为合成演示。性能改进目标尚未量测，不代表服务已上线。</div></div>`}
function render(){intents.clear();document.documentElement.classList.toggle('dark',dark);document.querySelector('#app').innerHTML=pageHeader()+`<main class="scene">${section==='learning'?learning():section==='translation'?translation():section==='share'?share():flow()}</main>`;syncURL();updateSave()}
function updateSave(){const b=document.querySelector('#save-review');if(b)b.disabled=state==='disconnect'||!(verified&&choice&&intents.size===5);const s=document.querySelector('#draftstatus');if(s&&state!=='disconnect')s.textContent=verified||choice?'有未保存修改':'尚未修改'}
function navigate(sec,st){section=sec;state=st||states[sec][0][0];if(sec==='learning'&&!st)state='review';if(sec==='translation'&&!st)state='live';render()}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;if(b.dataset.section)return navigate(b.dataset.section);if(b.dataset.state){state=b.dataset.state;return render()}if(b.dataset.jump){const [sec,st]=b.dataset.jump.split(':');return navigate(sec,st)}if(b.dataset.clip!==undefined){selected=+b.dataset.clip;verified=false;choice=false;intents.clear();return render()}switch(b.dataset.action){case'theme':dark=!dark;render();break;case'close':toast('窗口已关闭（设计演示）');navigate('flow','all');break;case'save':verified=false;choice=false;intents.clear();selected=(selected+1)%5;render();toast('本段标注已保存，已进入下一段（演示）');break;case'nextclip':case'skip':selected=(selected+1)%5;verified=false;choice=false;intents.clear();render();break;case'listen':toast('此处将核听当前片段原音；设计稿未加载真实音频');break;case'play':toast('原音播放器示意，未加载真实会议');break;case'translation-toggle':state=state==='paused'?'live':'paused';render();break;case'retry':state='live';render();toast('已重试失败片段（演示）');break;case'recheck':toast('正在重新探测服务（演示）');break;case'diff':navigate('learning','review');toast('已定位仍需核对的片段（演示）');break;case'configure':toast('实现后打开现有模型设置');break;case'export':toast('分享文件仅包含纪要；设计演示未导出真实内容');break;case'new':toast('沿用现有新会议流程');break;case'livefirst':toast('新发言始终优先，历史队列在后台补译');break;default:toast('控件样式示意')}});
document.addEventListener('change',e=>{if(e.target.name.startsWith('intent-')){intents.add(e.target.name);updateSave()}if(e.target.id==='verified'){verified=e.target.checked;updateSave()}if(e.target.name==='candidate'){choice=true;updateSave();document.querySelector('#correction').hidden=e.target.value!=='none';if(e.target.value==='skip'){verified=true;updateSave()}}if(e.target.id==='confirm-training'){confirmed=e.target.checked;document.querySelector('#start-training').disabled=!confirmed}if(e.target.id==='show-source'){original=e.target.checked;document.querySelector('.translation-scroll').classList.toggle('source-hidden',!original)}});
render();
</script></body></html>
