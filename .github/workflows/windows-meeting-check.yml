name: Windows release-test diagnostic
on:
  push:
    branches: [dev_meeting-polish]
permissions:
  contents: read
jobs:
  tests:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24.21.0'
      - run: npm ci
      - name: Inspect checkout line endings
        run: node --input-type=module -e "import{readFileSync}from'node:fs';const s=readFileSync('apps/desktop/src-tauri/Cargo.lock','utf8');console.log(JSON.stringify({crlf:s.split('\r\n').length-1,lf:s.split('\n').length-1}));"
      - name: Diagnose release test group
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference=$false
          New-Item -ItemType Directory -Force .agent-runtime | Out-Null
          & node --test tests/records-desktop-entry.test.mjs tests/records-audio-storage-sync.test.mjs tests/records-release-source.test.mjs tests/records-preview-release.test.mjs 2>&1 | Tee-Object .agent-runtime/release-tests.log
          $status=$LASTEXITCODE
          if($status -ne 0){
            $log=(Get-Content .agent-runtime/release-tests.log | Where-Object {$_ -notmatch '(?i)authorization|bearer |password|api[_-]?key|cookie'}) -join "`n"
            $tail=$log.Substring([Math]::Max(0,$log.Length-6500))
            for($i=0;$i -lt $tail.Length;$i+=900){$part=$tail.Substring($i,[Math]::Min(900,$tail.Length-$i)).Replace('%','%25').Replace("`r",'%0D').Replace("`n",'%0A');Write-Host "::error title=Release test diagnostic::$part"}
          }
          exit $status
