name: Cloudflare Pages beta
run-name: Pages ${{ github.ref_name }} · ${{ github.event_name }}
on:
  push:
    tags: ['v[0-9]*.[0-9]*.[0-9]*']
  workflow_dispatch:
  schedule:
    - cron: '20 3 * * *'
permissions:
  contents: read
concurrency:
  group: cloudflare-pages-production
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '26.12.1'
          cache: npm
      - name: Verify source belongs to main
        run: |
          git merge-base --is-ancestor HEAD origin/main
          test "$GITHUB_EVENT_NAME" = push || test "$GITHUB_REF" = refs/heads/main
      - run: npm ci
      - name: Verify sharing and website
        if: github.event_name != 'schedule'
        run: |
          node --test tests/records-published-site.test.mjs tests/records-encrypted-sharing.test.mjs tests/records-site-downloads.test.mjs
          npm run lint
          npm run build:site
      - name: Publish or clean expired metadata
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SITE_GITHUB_CLIENT_ID: ${{ secrets.SITE_GITHUB_CLIENT_ID }}
          SITE_GITHUB_CLIENT_SECRET: ${{ secrets.SITE_GITHUB_CLIENT_SECRET }}
          PUBLISHER_GITHUB_ID: ${{ vars.PUBLISHER_GITHUB_ID }}
          DOWNLOADS_BASE_URL: ${{ vars.DOWNLOADS_BASE_URL }}
        run: node scripts/deploy-public-site.mjs ${{ github.event_name == 'schedule' && '--cleanup' || '' }}
      - name: Verify anonymous encrypted sharing on official domain
        if: github.event_name != 'schedule'
        run: node scripts/verify-encrypted-site.mjs
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always() && github.event_name != 'schedule'
        with:
          name: cloudflare-publication-receipt
          path: |
            cloudflare-publication-receipt.json
            encrypted-site-verification.json
          if-no-files-found: error
