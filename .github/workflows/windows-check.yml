name: Windows desktop verification
on:
  push:
    branches: [dev_windows-resident]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    runs-on: windows-2025
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24.21.0'
      - run: npm ci
      - run: npm run build:web
      - run: node scripts/prepare-client-backend.mjs
      - name: Native regression
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          New-Item -ItemType Directory -Force .agent-runtime | Out-Null
          & cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --locked --features smoke-test -- --test-threads=1 2>&1 | Tee-Object .agent-runtime/windows-rust.log
          $nativeStatus = $LASTEXITCODE
          if ($nativeStatus -ne 0) {
            $log = Get-Content .agent-runtime/windows-rust.log -Raw
            $tail = $log.Substring([Math]::Max(0, $log.Length - 6500))
            for ($at = 0; $at -lt $tail.Length; $at += 1000) {
              $part = $tail.Substring($at, [Math]::Min(1000, $tail.Length - $at)).Replace('%','%25').Replace("`r",'%0D').Replace("`n",'%0A')
              Write-Output "::error title=Windows native diagnostic::$part"
            }
          }
          exit $nativeStatus
      - name: Build native probe
        run: cargo build --manifest-path apps/desktop/src-tauri/Cargo.toml --locked --features smoke-test
      - name: Hidden recording and restart replay
        env:
          NATIVE_CLIENT_EXECUTABLE: ${{ github.workspace }}\apps\desktop\src-tauri\target\debug\tts-client.exe
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          & node scripts/test-native-client.mjs .agent-runtime/windows-native.json 2>&1 | Tee-Object .agent-runtime/windows-probe.log
          $probeStatus = $LASTEXITCODE
          if ($probeStatus -ne 0) {
            $log = Get-Content .agent-runtime/windows-probe.log -Raw
            $log = [regex]::Replace($log, '(?im)^.*(?:authorization|cookie|api.?key|password).*$','[redacted diagnostic line]')
            $tail = $log.Substring([Math]::Max(0, $log.Length - 6500))
            for ($at = 0; $at -lt $tail.Length; $at += 1000) {
              $part = $tail.Substring($at, [Math]::Min(1000, $tail.Length - $at)).Replace('%','%25').Replace("`r",'%0D').Replace("`n",'%0A')
              Write-Output "::error title=Windows probe diagnostic::$part"
            }
          }
          exit $probeStatus
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: windows-native-${{ github.sha }}
          path: .agent-runtime/windows-native.json
          if-no-files-found: ignore
      - name: Build and verify Windows preview installer
        env:
          TTS_RELEASE_SOURCE_REF: ${{ github.sha }}
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          & npm run release:windows:preview 2>&1 | Tee-Object .agent-runtime/windows-package.log
          $status = $LASTEXITCODE
          if ($status -ne 0) {
            $log = (Get-Content .agent-runtime/windows-package.log | Where-Object { $_ -notmatch '(?i)authorization|bearer |password|api[_-]?key|cookie' }) -join "`n"
            $tail = $log.Substring([Math]::Max(0,$log.Length-7500))
            for ($at=0;$at -lt $tail.Length;$at+=1000) {
              $part=$tail.Substring($at,[Math]::Min(1000,$tail.Length-$at)).Replace('%','%25').Replace("`r",'%0D').Replace("`n",'%0A')
              Write-Output "::error title=Windows package diagnostic::$part"
            }
          }
          exit $status
      - name: Collect Windows release files
        env:
          RELEASE_VERSION: 0.1.16
          SOURCE_SHA: ${{ github.sha }}
          WORKFLOW_SHA: ${{ github.sha }}
        run: node scripts/collect-preview-artifacts.mjs windows
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: preview-windows-x64-${{ github.sha }}
          path: preview-artifacts/*
          if-no-files-found: error
          retention-days: 14
