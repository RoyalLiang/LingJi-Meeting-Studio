name: Feishu HTTPS callback relay
run-name: Feishu relay · ${{ github.sha }} · ${{ github.event_name }}
on:
  push:
    branches: [main]
    paths: ['apps/feishu-relay/**', 'packages/records/src/feishu-oauth.mjs', 'scripts/*feishu-relay.mjs', '.github/workflows/feishu-relay.yml']
  workflow_dispatch:
  schedule:
    - cron: '37 * * * *'
permissions:
  contents: read
concurrency:
  group: cloudflare-feishu-relay-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '26.12.1'
      - run: git merge-base --is-ancestor HEAD origin/main
      - run: npm ci --ignore-scripts
      - if: github.event_name != 'schedule'
        run: node --test tests/records-feishu-relay.test.mjs tests/records-feishu-relay-deploy.test.mjs
      - if: github.event_name != 'schedule'
        run: npm run build:feishu-relay
      - name: Deploy or retire expired authorization transactions
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/deploy-feishu-relay.mjs ${{ github.event_name == 'schedule' && '--cleanup' || '' }}
      - if: always() && github.event_name != 'schedule'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: feishu-relay-deployment-receipt
          path: feishu-relay-deployment-receipt.json
          if-no-files-found: ignore
