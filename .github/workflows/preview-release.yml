name: macOS preview release
run-name: Preview ${{ inputs.tag || github.ref_name }} · ${{ github.event_name }}

on:
  push:
    tags: ['v[0-9]*.[0-9]*.[0-9]*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing vX.Y.Z source tag (published tags are never moved)
        required: true
        default: v0.1.10
        type: string
      source_sha:
        description: Expected full source commit; reject a moved tag
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: preview-release-${{ github.repository }}-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      version: ${{ steps.source.outputs.version }}
      controller_sha: ${{ steps.source.outputs.controller_sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.21.0'
      - run: node --test tests/records-preview-release.test.mjs
      - id: source
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          EXPECTED_SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          SOURCE_SHA=$(git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}")
          WORKFLOW_SHA=$(git rev-parse --verify HEAD)
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            [[ "$GITHUB_REF" == "refs/tags/$RELEASE_TAG" ]]
            EXPECTED_SOURCE_SHA=$(git rev-parse --verify "$GITHUB_SHA^{commit}")
          else
            [[ "$GITHUB_EVENT_NAME" == workflow_dispatch && "$GITHUB_REF" == refs/heads/main ]]
          fi
          [[ "$EXPECTED_SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$SOURCE_SHA" == "$EXPECTED_SOURCE_SHA" ]]
          git merge-base --is-ancestor "$SOURCE_SHA" origin/main
          export SOURCE_SHA WORKFLOW_SHA
          node --input-type=module <<'NODE'
          import {execFileSync} from 'node:child_process';
          import assert from 'node:assert/strict';
          import {assertReleaseEvent} from './scripts/publish-preview-release.mjs';
          assertReleaseEvent({eventName:process.env.GITHUB_EVENT_NAME,ref:process.env.GITHUB_REF,tag:process.env.RELEASE_TAG,commit:process.env.SOURCE_SHA,workflowSha:process.env.WORKFLOW_SHA});
          const cfg=JSON.parse(execFileSync('git',['show',process.env.SOURCE_SHA+':apps/desktop/src-tauri/tauri.preview.conf.json']));
          assert.equal('v'+cfg.version,process.env.RELEASE_TAG);
          NODE
          echo "sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"
          echo "controller_sha=$WORKFLOW_SHA" >> "$GITHUB_OUTPUT"
  build:
    needs: verify
    runs-on: macos-15
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.verify.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.21.0'
          cache: npm
      - name: Require Apple Silicon runner
        run: test "$(uname -m)" = arm64 && node -e "if(process.arch!=='arm64')process.exit(1)"
      - run: rustup toolchain install 1.92.0 --profile minimal && rustup default 1.92.0
      - run: npm ci
      - run: npm test
      - run: npm run lint && npm run typecheck && npm run check:docs
      - name: Prepare bundled runtime and Web assets for native checks
        run: node scripts/prepare-client-backend.mjs && npm run build:web
      - name: Native regression
        run: |
          mkdir -p .agent-runtime
          set +e
          cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --locked --features smoke-test -- --test-threads=1 2>&1 | tee .agent-runtime/native-ci-tests.log
          native_status=${PIPESTATUS[0]}
          set -e
          if [[ "$native_status" -ne 0 ]]; then
            node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const tail = readFileSync('.agent-runtime/native-ci-tests.log', 'utf8').slice(-18000);
          const blocks = tail.match(/[\s\S]{1,1000}/g) || [];
          for (const [index, block] of blocks.entries()) {
            const message = block.replaceAll('%', '%25').replaceAll('\r', '%0D').replaceAll('\n', '%0A');
            console.log(`::error title=Native regression ${index + 1}/${blocks.length}::${message}`);
          }
          NODE
          fi
          exit "$native_status"
      - name: Build and verify isolated preview package
        env:
          TTS_RELEASE_SOURCE_REF: ${{ needs.verify.outputs.sha }}
          # Keep the configured Finder background/positions and their validation.
          TAURI_BUNDLER_DMG_IGNORE_CI: 'true'
        run: npm run release:macos:preview
      - name: Add CI provenance and collect five release files
        env:
          RELEASE_VERSION: ${{ needs.verify.outputs.version }}
          SOURCE_SHA: ${{ needs.verify.outputs.sha }}
          WORKFLOW_SHA: ${{ needs.verify.outputs.controller_sha }}
        run: |
          node --input-type=module <<'NODE'
          import {readFile,writeFile,mkdir,copyFile} from 'node:fs/promises';
          import assert from 'node:assert/strict';
          const dir='dist/releases/'+process.env.RELEASE_VERSION;
          const meta=JSON.parse(await readFile(dir+'/release.json','utf8'));
          assert.equal(meta.sourceRevision,process.env.SOURCE_SHA);
          assert.equal(meta.sourceDirty,false);
          meta.ci={repository:process.env.GITHUB_REPOSITORY,runId:process.env.GITHUB_RUN_ID,
            runUrl:`https://github.com/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`,
            workflowSha:process.env.WORKFLOW_SHA,sourceRevision:process.env.SOURCE_SHA};
          await writeFile(dir+'/release.json',JSON.stringify(meta,null,2)+'\n');
          await mkdir('preview-artifacts');
          for(const name of [meta.artifact,'SHA256SUMS.txt','release.json','package-smoke.json'])await copyFile(dir+'/'+name,'preview-artifacts/'+name);
          await copyFile(dir+'/安装说明.md','preview-artifacts/INSTALL-macos-arm64.md');
          NODE
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: preview-macos-arm64-${{ needs.verify.outputs.sha }}
          path: preview-artifacts/*
          if-no-files-found: error
          retention-days: 14
  publish:
    needs: [verify, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.verify.outputs.controller_sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.21.0'
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: preview-macos-arm64-${{ needs.verify.outputs.sha }}
          path: preview-artifacts
      - name: Verify assets, reconcile draft and publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          RELEASE_SHA: ${{ needs.verify.outputs.sha }}
          RELEASE_WORKFLOW_SHA: ${{ needs.verify.outputs.controller_sha }}
        run: node scripts/publish-preview-release.mjs preview-artifacts
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: preview-publication-receipt
          path: preview-publication-receipt.json
          if-no-files-found: error
