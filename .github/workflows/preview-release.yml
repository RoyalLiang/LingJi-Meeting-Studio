name: Desktop preview release
run-name: Preview ${{ inputs.tag || github.ref_name }} · ${{ github.event_name }}

on:
  push:
    tags: ['v[0-9]*.[0-9]*.[0-9]*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing vX.Y.Z source tag (published tags are never moved)
        required: true
        default: v0.3.0
        type: string
      source_sha:
        description: Expected full source commit; reject a moved tag
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: preview-release-${{ github.repository }}-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      version: ${{ steps.source.outputs.version }}
      controller_sha: ${{ steps.source.outputs.controller_sha }}
      vocabulary_version: ${{ steps.source.outputs.vocabulary_version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '26.12.1'
      - run: node --test tests/records-preview-release.test.mjs
      - id: source
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          EXPECTED_SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          SOURCE_SHA=$(git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}")
          WORKFLOW_SHA=$(git rev-parse --verify HEAD)
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            [[ "$GITHUB_REF" == "refs/tags/$RELEASE_TAG" ]]
            EXPECTED_SOURCE_SHA=$(git rev-parse --verify "$GITHUB_SHA^{commit}")
          else
            [[ "$GITHUB_EVENT_NAME" == workflow_dispatch && "$GITHUB_REF" == refs/heads/main ]]
          fi
          [[ "$EXPECTED_SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$SOURCE_SHA" == "$EXPECTED_SOURCE_SHA" ]]
          git merge-base --is-ancestor "$SOURCE_SHA" origin/main
          export SOURCE_SHA WORKFLOW_SHA
          node --input-type=module <<'NODE'
          import {execFileSync} from 'node:child_process';
          import {appendFileSync} from 'node:fs';
          import assert from 'node:assert/strict';
          import {assertReleaseEvent} from './scripts/publish-preview-release.mjs';
          assertReleaseEvent({eventName:process.env.GITHUB_EVENT_NAME,ref:process.env.GITHUB_REF,tag:process.env.RELEASE_TAG,commit:process.env.SOURCE_SHA,workflowSha:process.env.WORKFLOW_SHA});
          const cfg=JSON.parse(execFileSync('git',['show',process.env.SOURCE_SHA+':apps/desktop/src-tauri/tauri.preview.conf.json']));
          assert.equal('v'+cfg.version,process.env.RELEASE_TAG);
          const vocabulary=JSON.parse(execFileSync('git',['show',process.env.SOURCE_SHA+':services/records/src/data/builtin-vocabulary.manifest.json']));
          assert.ok(['20261105.2','20261105.3','20261106.4'].includes(vocabulary.version),'Unsupported vocabulary input version');
          appendFileSync(process.env.GITHUB_OUTPUT,`vocabulary_version=${vocabulary.version}\n`);
          NODE
          echo "sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"
          echo "controller_sha=$WORKFLOW_SHA" >> "$GITHUB_OUTPUT"
  build:
    name: macOS build and native verification
    needs: verify
    runs-on: macos-15
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.verify.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '26.12.1'
          cache: npm
      - name: Require Apple Silicon runner
        run: test "$(uname -m)" = arm64 && node -e "if(process.arch!=='arm64')process.exit(1)"
      - run: rustup toolchain install 1.92.0 --profile minimal && rustup default 1.92.0
      - run: npm ci
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .agent-runtime/runtimes
          key: lingji-public-runtimes-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/prepare-client-backend.mjs', 'services/records/src/local-asr-resources.json', 'scripts/asr-test-fixtures.mjs') }}
      - name: Prepare pinned public ASR samples before package verification
        run: node scripts/asr-test-fixtures.mjs
      - name: Materialize private built-in vocabulary
        env:
          TTS_BUILTIN_VOCABULARY_GZIP_BASE64_PART1: ${{ (needs.verify.outputs.vocabulary_version == '20261105.2' && secrets.TTS_BUILTIN_VOCABULARY_GZIP_BASE64_PART1) || (needs.verify.outputs.vocabulary_version == '20261105.3' && secrets.TTS_BUILTIN_VOCABULARY_20261105_3_PART1) || (needs.verify.outputs.vocabulary_version == '20261106.4' && secrets.TTS_BUILTIN_VOCABULARY_20261106_4_PART1) }}
          TTS_BUILTIN_VOCABULARY_GZIP_BASE64_PART2: ${{ (needs.verify.outputs.vocabulary_version == '20261105.2' && secrets.TTS_BUILTIN_VOCABULARY_GZIP_BASE64_PART2) || (needs.verify.outputs.vocabulary_version == '20261105.3' && secrets.TTS_BUILTIN_VOCABULARY_20261105_3_PART2) || (needs.verify.outputs.vocabulary_version == '20261106.4' && secrets.TTS_BUILTIN_VOCABULARY_20261106_4_PART2) }}
        run: node scripts/materialize-builtin-vocabulary.mjs
      - name: Keep vocabulary payload outside Git
        run: git check-ignore --quiet services/records/src/data/builtin-vocabulary.private.json
      - run: npm test
      - run: npm run lint && npm run typecheck && npm run check:docs
      - name: Prepare bundled runtime and Web assets for native checks
        run: node scripts/prepare-client-backend.mjs && npm run build:web
      - name: Native regression
        run: |
          mkdir -p .agent-runtime
          set +e
          cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --locked --features smoke-test -- --test-threads=1 2>&1 | tee .agent-runtime/native-ci-tests.log
          native_status=${PIPESTATUS[0]}
          set -e
          if [[ "$native_status" -ne 0 ]]; then
            node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const tail = readFileSync('.agent-runtime/native-ci-tests.log', 'utf8').slice(-6000);
          const blocks = tail.match(/[\s\S]{1,1000}/g) || [];
          for (const [index, block] of blocks.entries()) {
            const message = block.replaceAll('%', '%25').replaceAll('\r', '%0D').replaceAll('\n', '%0A');
            console.log(`::error title=Native regression ${index + 1}/${blocks.length}::${message}`);
          }
          NODE
          fi
          exit "$native_status"
      - name: Native background recording and renderer recovery smoke
        run: |
          cargo build --manifest-path apps/desktop/src-tauri/Cargo.toml --locked --features smoke-test
          node scripts/test-native-evolution.mjs .agent-runtime/native-evolution-macos.json
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: macos-native-evolution-${{ needs.verify.outputs.sha }}
          path: .agent-runtime/native-evolution-macos.json
          if-no-files-found: ignore
      - name: Build and verify isolated preview package
        env:
          TTS_RELEASE_SOURCE_REF: ${{ needs.verify.outputs.sha }}
          # Keep the configured Finder background/positions and their validation.
          TAURI_BUNDLER_DMG_IGNORE_CI: 'true'
        run: npm run release:macos:preview
      - name: Add CI provenance and collect macOS release files
        env:
          RELEASE_VERSION: ${{ needs.verify.outputs.version }}
          SOURCE_SHA: ${{ needs.verify.outputs.sha }}
          WORKFLOW_SHA: ${{ needs.verify.outputs.controller_sha }}
        run: node scripts/collect-preview-artifacts.mjs macos
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: preview-macos-arm64-${{ needs.verify.outputs.sha }}
          path: preview-artifacts/*
          if-no-files-found: error
          retention-days: 14
  build_wgs:
    name: WGS build - Linux and Windows
    needs: verify
    runs-on: [self-hosted, Linux, X64, lingji-wgs]
    timeout-minutes: 90
    env:
      TTS_RELEASE_SOURCE_REF: ${{ needs.verify.outputs.sha }}
      WGS_SOURCE_DIRECTORY: /home/westwell/builds/lingji-preview-20261107/source-240245aa
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.verify.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '26.12.1'
          package-manager-cache: false
      - name: Build Linux and Windows in the locked current WGS checkout
        id: packages
        run: node scripts/wgs-build-preview.mjs
      - name: Collect verified Linux package
        working-directory: /home/westwell/builds/lingji-preview-20261107/source-240245aa
        env:
          RELEASE_VERSION: ${{ needs.verify.outputs.version }}
          SOURCE_SHA: ${{ needs.verify.outputs.sha }}
          WORKFLOW_SHA: ${{ needs.verify.outputs.controller_sha }}
        run: node scripts/collect-preview-artifacts.mjs linux
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: preview-linux-x64-${{ needs.verify.outputs.sha }}
          path: /home/westwell/builds/lingji-preview-20261107/source-240245aa/preview-artifacts/*
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: wgs-windows-input-${{ needs.verify.outputs.sha }}
          path: ${{ steps.packages.outputs.windows }}/*
          if-no-files-found: error
          retention-days: 2

  build_windows:
    name: Windows verification - WGS installer
    needs: [verify, build_wgs]
    runs-on: windows-2025
    timeout-minutes: 90
    env:
      TTS_PREBUILT_DIRECTORY: ${{ github.workspace }}\.agent-runtime\wgs-windows-input
      TTS_NATIVE_BACKGROUND_MS: '360000'
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ needs.verify.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: wgs-windows-input-${{ needs.verify.outputs.sha }}
          path: .agent-runtime/wgs-windows-input
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24.21.0'
      - run: rustup toolchain install 1.92.0 --profile minimal; rustup default 1.92.0
      - run: npm ci
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .agent-runtime/runtimes
          key: lingji-public-runtimes-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/prepare-client-backend.mjs', 'services/records/src/local-asr-resources.json', 'scripts/asr-test-fixtures.mjs') }}
      - name: Prepare pinned public ASR samples before package verification
        run: node scripts/asr-test-fixtures.mjs
      - name: Materialize private built-in vocabulary
        env:
          TTS_BUILTIN_VOCABULARY_GZIP_BASE64_PART1: ${{ (needs.verify.outputs.vocabulary_version == '20261105.2' && secrets.TTS_BUILTIN_VOCABULARY_GZIP_BASE64_PART1) || (needs.verify.outputs.vocabulary_version == '20261105.3' && secrets.TTS_BUILTIN_VOCABULARY_20261105_3_PART1) || (needs.verify.outputs.vocabulary_version == '20261106.4' && secrets.TTS_BUILTIN_VOCABULARY_20261106_4_PART1) }}
          TTS_BUILTIN_VOCABULARY_GZIP_BASE64_PART2: ${{ (needs.verify.outputs.vocabulary_version == '20261105.2' && secrets.TTS_BUILTIN_VOCABULARY_GZIP_BASE64_PART2) || (needs.verify.outputs.vocabulary_version == '20261105.3' && secrets.TTS_BUILTIN_VOCABULARY_20261105_3_PART2) || (needs.verify.outputs.vocabulary_version == '20261106.4' && secrets.TTS_BUILTIN_VOCABULARY_20261106_4_PART2) }}
        run: node scripts/materialize-builtin-vocabulary.mjs
      - name: Keep vocabulary payload outside Git
        run: git check-ignore --quiet services/records/src/data/builtin-vocabulary.private.json
      - name: Check installer PowerShell syntax
        shell: pwsh
        run: |
          foreach ($script in @('scripts/test-windows-installer.ps1','scripts/test-windows-installer-ui.ps1')) {
            $tokens=$null; $parseErrors=$null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $script),[ref]$tokens,[ref]$parseErrors)
            if ($parseErrors.Count -gt 0) { throw ($parseErrors | Out-String) }
          }
          $installerVerifier=Get-Content scripts/test-windows-installer-ui.ps1 -Raw
          $installerNative=[regex]::Match($installerVerifier,"(?s)Add-Type @'\r?\n(.*?)\r?\n'@")
          if(-not $installerNative.Success){throw 'Native installer verifier source missing'}
          Add-Type -TypeDefinition $installerNative.Groups[1].Value
          [LingJiInstallerWindow]::VerifyControlLookup()
      - run: node --test tests/records-desktop-entry.test.mjs tests/records-audio-storage-sync.test.mjs tests/records-release-source.test.mjs tests/records-preview-release.test.mjs
      - run: npm run build:web
      - run: node scripts/prepare-client-backend.mjs
      - name: Git sync admission, progress and restart regression on Windows
        run: '& ".\apps\desktop\src-tauri\resources\runtime\node.exe" --test tests/records-agent-compaction.test.mjs tests/records-git-sync-progress.test.mjs tests/records-meeting-tasks.test.mjs tests/records-git-sync.test.mjs tests/records-git-polish.test.mjs'
      - name: Isolated bundled backend startup
        env:
          CLIENT_NODE_EXECUTABLE: ${{ github.workspace }}\apps\desktop\src-tauri\resources\runtime\node.exe
          CLIENT_BACKEND_ENTRY: ${{ github.workspace }}\apps\desktop\src-tauri\resources\client-backend\services\records\src\desktop-backend.mjs
        run: node scripts/test-standalone-package.mjs
      - name: Restore Windows Rust dependency cache
        id: rust_cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5, Node 24
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/desktop/src-tauri/target/debug/deps
            apps/desktop/src-tauri/target/debug/build
            apps/desktop/src-tauri/target/debug/.fingerprint
            apps/desktop/src-tauri/target/release/deps
            apps/desktop/src-tauri/target/release/build
            apps/desktop/src-tauri/target/release/.fingerprint
          key: windows-2025-rust192-v1-${{ hashFiles('apps/desktop/src-tauri/Cargo.lock') }}
          restore-keys: windows-2025-rust192-v1-
      - name: Native regression
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          New-Item -ItemType Directory -Force .agent-runtime | Out-Null
          & cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --locked --features smoke-test -- --test-threads=1 2>&1 | Tee-Object .agent-runtime/windows-rust.log
          $nativeStatus = $LASTEXITCODE
          if ($nativeStatus -ne 0) {
            $log = Get-Content .agent-runtime/windows-rust.log -Raw
            $tail = $log.Substring([Math]::Max(0, $log.Length - 6500))
            for ($at = 0; $at -lt $tail.Length; $at += 1000) {
              $part = $tail.Substring($at, [Math]::Min(1000, $tail.Length - $at)).Replace('%','%25').Replace("`r",'%0D').Replace("`n",'%0A')
              Write-Output "::error title=Windows native diagnostic::$part"
            }
          }
          exit $nativeStatus
      - name: Build native probe
        run: cargo build --manifest-path apps/desktop/src-tauri/Cargo.toml --locked --features smoke-test
      - name: Hidden recording and restart replay
        env:
          NATIVE_CLIENT_EXECUTABLE: ${{ github.workspace }}\apps\desktop\src-tauri\target\debug\tts-client.exe
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          & node scripts/test-native-client.mjs .agent-runtime/windows-native.json 2>&1 | Tee-Object .agent-runtime/windows-probe.log
          $probeStatus = $LASTEXITCODE
          if ($probeStatus -ne 0) {
            $log = Get-Content .agent-runtime/windows-probe.log -Raw
            $log = [regex]::Replace($log, '(?im)^.*(?:authorization|cookie|api.?key|password).*$','[redacted diagnostic line]')
            $tail = $log.Substring([Math]::Max(0, $log.Length - 6500))
            for ($at = 0; $at -lt $tail.Length; $at += 1000) {
              $part = $tail.Substring($at, [Math]::Min(1000, $tail.Length - $at)).Replace('%','%25').Replace("`r",'%0D').Replace("`n",'%0A')
              Write-Output "::error title=Windows probe diagnostic::$part"
            }
          }
          exit $probeStatus
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: windows-native-${{ github.sha }}
          path: .agent-runtime/windows-native.json
          if-no-files-found: ignore
      - name: Native background recording and renderer recovery smoke
        env:
          NATIVE_CLIENT_EXECUTABLE: ${{ github.workspace }}\apps\desktop\src-tauri\target\debug\tts-client.exe
        run: |
          $PSNativeCommandUseErrorActionPreference=$false
          node scripts/test-native-evolution.mjs .agent-runtime/native-evolution-windows.json *> .agent-runtime/windows-evolution.log
          $probeStatus=$LASTEXITCODE
          if($probeStatus -ne 0){Get-Content .agent-runtime/windows-evolution.log -Tail 60;exit $probeStatus}
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: windows-native-evolution-${{ needs.verify.outputs.sha }}
          path: .agent-runtime/native-evolution-windows.json
          if-no-files-found: ignore
      - name: Verify the WGS-built Windows preview installer
        timeout-minutes: 60
        env:
          TTS_RELEASE_SOURCE_REF: ${{ needs.verify.outputs.sha }}
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          & npm run release:windows:preview 2>&1 | Tee-Object .agent-runtime/windows-package.log
          $status = $LASTEXITCODE
          if ($status -ne 0) {
            $log = (Get-Content .agent-runtime/windows-package.log | Where-Object { $_ -notmatch '(?i)authorization|bearer |password|api[_-]?key|cookie|::notice title=LingJi installer ' }) -join "`n"
            $tail = $log.Substring([Math]::Max(0,$log.Length-7500))
            for ($at=0;$at -lt $tail.Length;$at+=1000) {
              $part=$tail.Substring($at,[Math]::Min(1000,$tail.Length-$at)).Replace('%','%25').Replace("`r",'%0D').Replace("`n",'%0A')
              Write-Output "::error title=Windows package diagnostic::$part"
            }
          }
          exit $status
      - name: Inspect installer welcome screenshot
        if: ${{ always() }}
        run: node scripts/expose-installer-screen.mjs welcome
      - name: Inspect installer settings screenshot
        if: ${{ always() }}
        run: node scripts/expose-installer-screen.mjs settings
      - name: Inspect installer installing screenshot
        if: ${{ always() }}
        run: node scripts/expose-installer-screen.mjs installing
      - name: Inspect installer finish screenshot
        if: ${{ always() }}
        run: node scripts/expose-installer-screen.mjs finish
      - name: Inspect installer unexpected screenshot
        if: ${{ always() }}
        run: node scripts/expose-installer-screen.mjs unexpected
      - name: Save Windows Rust dependency cache
        if: ${{ always() && !cancelled() && steps.rust_cache.outcome == 'success' && steps.rust_cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/desktop/src-tauri/target/debug/deps
            apps/desktop/src-tauri/target/debug/build
            apps/desktop/src-tauri/target/debug/.fingerprint
            apps/desktop/src-tauri/target/release/deps
            apps/desktop/src-tauri/target/release/build
            apps/desktop/src-tauri/target/release/.fingerprint
          key: ${{ steps.rust_cache.outputs.cache-primary-key }}
      - name: Collect Windows release files
        env:
          RELEASE_VERSION: ${{ needs.verify.outputs.version }}
          SOURCE_SHA: ${{ needs.verify.outputs.sha }}
          WORKFLOW_SHA: ${{ needs.verify.outputs.controller_sha }}
        run: node scripts/collect-preview-artifacts.mjs windows
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: preview-windows-x64-${{ needs.verify.outputs.sha }}
          path: preview-artifacts/*
          if-no-files-found: error
          retention-days: 14
  verify_linux_24:
    name: Ubuntu 24 verification - WGS package
    needs: [verify, build_wgs]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ needs.verify.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24.21.0'
          cache: npm
      - run: npm ci
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .agent-runtime/runtimes
          key: lingji-public-runtimes-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/prepare-client-backend.mjs', 'services/records/src/local-asr-resources.json', 'scripts/asr-test-fixtures.mjs') }}
      - name: Prepare pinned public ASR samples before package verification
        run: node scripts/asr-test-fixtures.mjs
      - name: Prepare Ubuntu verification dependencies
        run: |
          printf '%s\n' 'https://archive.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/sources.list.d/ubuntu.sources
          sudo python3 - <<'PY'
          import ipaddress, json, subprocess
          from pathlib import Path

          def public_addresses(payload):
              if payload.get('Status') != 0:
                  raise ValueError('Ubuntu DNS lookup failed')
              addresses = {entry['data'] for entry in payload.get('Answer', []) if entry.get('type') == 1}
              if not addresses:
                  raise ValueError('Ubuntu DNS returned no IPv4 records')
              for value in addresses:
                  address = ipaddress.IPv4Address(value)
                  if not address.is_global or address.is_multicast:
                      raise ValueError('Ubuntu DNS returned a non-public address')
              return sorted(addresses)

          mappings = []
          hosts = ('archive.ubuntu.com', 'security.ubuntu.com')
          for host in hosts:
              response = subprocess.check_output(['curl', '--fail', '--silent', '--show-error', '--proto', '=https', '--connect-timeout', '5', '--max-time', '15', '--max-filesize', '65536', '-H', 'Accept: application/dns-json', 'https://1.1.1.1/dns-query?name=' + host + '&type=A'], timeout=20)
              if len(response) > 65536:
                  raise ValueError('Ubuntu DNS response too large')
              addresses = public_addresses(json.loads(response))
              mappings.extend(address + ' ' + host for address in addresses)
          path = Path('/etc/hosts')
          existing = [line.split('#', 1)[0].split()[1:] for line in path.read_text().splitlines()]
          if any(host in names for names in existing for host in hosts):
              raise ValueError('Preserve existing Ubuntu host overrides')
          with path.open('a') as output:
              output.write('\n' + '\n'.join(mappings) + '\n')
          PY
          printf '%s\n' 'Acquire::ForceIPv4 "true";' 'Acquire::Retries "3";' 'Acquire::http::Timeout "20";' 'Acquire::https::Timeout "20";' | sudo tee /etc/apt/apt.conf.d/80-lingji-preview-network >/dev/null
          sudo apt-get update
          sudo apt-get install -y xvfb xauth
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53
        with:
          name: preview-linux-x64-${{ needs.verify.outputs.sha }}
          path: linux-compat-artifacts
      - name: Install the Ubuntu 22.04 package on Ubuntu 24.04
        env:
          SOURCE_SHA: ${{ needs.verify.outputs.sha }}
        run: node scripts/test-linux-compatibility.mjs linux-compat-artifacts .agent-runtime/ubuntu24-compatibility.json
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: linux-compat-ubuntu24-${{ needs.verify.outputs.sha }}
          path: .agent-runtime/ubuntu24-compatibility*.json
          if-no-files-found: ignore

  publish:
    name: Publish verified previews
    needs: [verify, build, build_windows, build_wgs, verify_linux_24]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.verify.outputs.controller_sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '26.12.1'
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          pattern: preview-*-${{ needs.verify.outputs.sha }}
          merge-multiple: true
          path: preview-artifacts
      - name: Verify assets, reconcile draft and publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          RELEASE_SHA: ${{ needs.verify.outputs.sha }}
          RELEASE_WORKFLOW_SHA: ${{ needs.verify.outputs.controller_sha }}
        run: node scripts/publish-preview-release.mjs preview-artifacts
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: preview-publication-receipt
          path: preview-publication-receipt.json
          if-no-files-found: error
