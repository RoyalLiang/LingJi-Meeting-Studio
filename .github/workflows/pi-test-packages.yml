name: Pi test packages
run-name: Pi test packages · ${{ github.sha }}

on:
  push:
    branches: [dev_pi-chain-regression-20261031]
    paths-ignore: ['docs/**', 'README.md']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pi-test-packages-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_BUILD_JOBS: '2'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
  TTS_RELEASE_SOURCE_REF: ${{ github.sha }}
  SOURCE_SHA: ${{ github.sha }}
  WORKFLOW_SHA: ${{ github.sha }}

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '26.12.1'
          cache: npm
      - run: test "$(uname -m)" = arm64
      - run: rustup toolchain install 1.92.0 --profile minimal && rustup default 1.92.0
      - run: npm ci
      - run: npm run lint && npm run typecheck && npm run build:web && npm test
      - run: node scripts/prepare-client-backend.mjs
      - run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --locked --features smoke-test -- --test-threads=1
      - name: Build and verify Mac test DMG
        env:
          TTS_RELEASE_CHANNEL: preview
        run: node scripts/release-macos-alpha.mjs
      - name: Collect source and package evidence
        run: |
          echo "RELEASE_VERSION=$(node -p 'require("./package.json").version')" >> "$GITHUB_ENV"
      - run: node scripts/collect-preview-artifacts.mjs macos
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: pi-test-macos-arm64-${{ github.sha }}
          path: preview-artifacts/*
          if-no-files-found: error
          retention-days: 14

  windows:
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '26.12.1'
          cache: npm
      - run: rustup toolchain install 1.92.0 --profile minimal; rustup default 1.92.0
      - run: npm ci
      - name: Check installer PowerShell syntax
        shell: pwsh
        run: |
          foreach ($script in @('scripts/test-windows-installer.ps1','scripts/test-windows-installer-ui.ps1')) {
            $tokens=$null; $parseErrors=$null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $script),[ref]$tokens,[ref]$parseErrors)
            if ($parseErrors.Count -gt 0) { throw ($parseErrors | Out-String) }
          }
      - run: node --test tests/records-desktop-entry.test.mjs tests/records-audio-storage-sync.test.mjs tests/records-release-source.test.mjs tests/records-preview-release.test.mjs
      - run: npm run build:web
      - run: node scripts/prepare-client-backend.mjs
      - run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --locked --features smoke-test -- --test-threads=1
      - name: Build and verify Windows test installer
        run: node scripts/release-windows-preview.mjs
      - name: Collect source and package evidence
        shell: pwsh
        run: |
          $version = node -p 'require("./package.json").version'
          "RELEASE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - run: node scripts/collect-preview-artifacts.mjs windows
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: pi-test-windows-x64-${{ github.sha }}
          path: preview-artifacts/*
          if-no-files-found: error
          retention-days: 14
