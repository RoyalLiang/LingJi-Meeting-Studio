name: Pi test packages
run-name: Pi test packages · ${{ github.sha }}

on:
  push:
    branches: [dev_pi-chain-regression-20261031]
    paths-ignore: ['docs/**', 'README.md']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pi-test-packages-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

env:
  CARGO_BUILD_JOBS: '2'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
  TTS_RELEASE_SOURCE_REF: ${{ github.sha }}
  SOURCE_SHA: ${{ github.sha }}
  WORKFLOW_SHA: ${{ github.sha }}

jobs:
  inspect_windows:
    if: contains(github.event.head_commit.message, '[inspect-windows]')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
    steps:
      - name: Read fixed Windows package progress flags
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          let response;
          for(let attempt=0;attempt<18;attempt++){
            response=await fetch(`https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/actions/jobs/124541073532/logs`,{headers:{Authorization:`Bearer ${process.env.GH_TOKEN}`,Accept:'application/vnd.github+json'}});
            if(response.ok)break;
            await response.body?.cancel();
            if(attempt<17)await new Promise(resolve=>setTimeout(resolve,25000));
          }
          if(!response.ok){console.log('::notice title=Fixed Windows build progress::'+JSON.stringify({logsAvailable:false}));process.exit(0);}
          const text=await response.text();
          const markers={
            rustCompilation:text.includes('Compiling '),
            releaseFinished:/Finished .*release.*profile/.test(text),
            bundling:text.includes('Bundling '),
            webviewDownload:/Downloading.*WebView2/i.test(text),
            silentProbe:text.includes('Windows packaging: Verify silent installation'),
            uiProbe:text.includes('Windows packaging: Inspect installer UI'),
            cancelled:text.includes('The operation was canceled'),
          };
          const codes=Object.fromEntries(['ERR_MODULE_NOT_FOUND','ERR_DLOPEN_FAILED','ERR_ASSERTION','ENOENT','EACCES','ETIMEDOUT','SIGKILL'].map(code=>[code,text.includes(code)]));
          console.log('::notice title=Fixed Windows build progress::'+JSON.stringify({logsAvailable:true,markers,codes}));
          NODE

  macos:
    if: ${{ !contains(github.event.head_commit.message, '[inspect-windows]') }}
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '26.12.1'
          cache: npm
      - run: test "$(uname -m)" = arm64
      - run: rustup toolchain install 1.92.0 --profile minimal && rustup default 1.92.0
      - run: npm ci
      - run: npm run lint && npm run typecheck && npm run build:web && npm test
      - run: node scripts/prepare-client-backend.mjs
      - run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --locked --features smoke-test -- --test-threads=1
      - name: Build and verify Mac test DMG
        env:
          TTS_RELEASE_CHANNEL: preview
          TAURI_BUNDLER_DMG_IGNORE_CI: 'true'
        run: node scripts/release-macos-alpha.mjs
      - name: Collect source and package evidence
        run: |
          echo "RELEASE_VERSION=$(node -p 'require("./package.json").version')" >> "$GITHUB_ENV"
      - run: node scripts/collect-preview-artifacts.mjs macos
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: pi-test-macos-arm64-${{ github.sha }}
          path: preview-artifacts/*
          if-no-files-found: error
          retention-days: 14

  windows:
    if: ${{ !contains(github.event.head_commit.message, '[inspect-windows]') }}
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '26.12.1'
          cache: npm
      - run: rustup toolchain install 1.92.0 --profile minimal; rustup default 1.92.0
      - run: npm ci
      - name: Check installer PowerShell syntax
        shell: pwsh
        run: |
          foreach ($script in @('scripts/test-windows-installer.ps1','scripts/test-windows-installer-ui.ps1')) {
            $tokens=$null; $parseErrors=$null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $script),[ref]$tokens,[ref]$parseErrors)
            if ($parseErrors.Count -gt 0) { throw ($parseErrors | Out-String) }
          }
      - run: node --test tests/records-desktop-entry.test.mjs tests/records-audio-storage-sync.test.mjs tests/records-release-source.test.mjs tests/records-preview-release.test.mjs
      - run: npm run build:web
      - run: node scripts/prepare-client-backend.mjs
      - name: Restore existing Windows Rust dependency cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/desktop/src-tauri/target/debug/deps
            apps/desktop/src-tauri/target/debug/build
            apps/desktop/src-tauri/target/debug/.fingerprint
            apps/desktop/src-tauri/target/release/deps
            apps/desktop/src-tauri/target/release/build
            apps/desktop/src-tauri/target/release/.fingerprint
          key: windows-2025-rust192-v1-${{ hashFiles('apps/desktop/src-tauri/Cargo.lock') }}
          restore-keys: windows-2025-rust192-v1-
      - run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --locked --features smoke-test -- --test-threads=1
      - name: Build and verify Windows test installer
        run: node scripts/release-windows-preview.mjs
      - name: Collect source and package evidence
        shell: pwsh
        run: |
          $version = node -p 'require("./package.json").version'
          "RELEASE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - run: node scripts/collect-preview-artifacts.mjs windows
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: pi-test-windows-x64-${{ github.sha }}
          path: preview-artifacts/*
          if-no-files-found: error
          retention-days: 14
