name: Bundled ASR and installer candidate
on:
  push:
    branches: [dev_bundled-sensevoice]
permissions:
  contents: read
jobs:
  build_windows:
    runs-on: windows-2025
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24.21.0'
      - run: rustup toolchain install 1.92.0 --profile minimal; rustup default 1.92.0
      - run: npm ci
      - name: Check installer PowerShell syntax
        shell: pwsh
        run: |
          foreach ($script in @('scripts/test-windows-installer.ps1','scripts/test-windows-installer-ui.ps1')) {
            $tokens=$null; $parseErrors=$null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $script),[ref]$tokens,[ref]$parseErrors)
            if ($parseErrors.Count -gt 0) { throw ($parseErrors | Out-String) }
          }
      - run: node --test tests/records-desktop-entry.test.mjs tests/records-audio-storage-sync.test.mjs tests/records-release-source.test.mjs tests/records-preview-release.test.mjs
      - run: npm run build:web
      - run: node scripts/prepare-client-backend.mjs
      - name: Restore Windows Rust dependency cache
        id: rust_cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5, Node 24
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/desktop/src-tauri/target/debug/deps
            apps/desktop/src-tauri/target/debug/build
            apps/desktop/src-tauri/target/debug/.fingerprint
            apps/desktop/src-tauri/target/release/deps
            apps/desktop/src-tauri/target/release/build
            apps/desktop/src-tauri/target/release/.fingerprint
          key: windows-2025-rust192-v1-${{ hashFiles('apps/desktop/src-tauri/Cargo.lock') }}
          restore-keys: windows-2025-rust192-v1-
      - name: Native regression
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          New-Item -ItemType Directory -Force .agent-runtime | Out-Null
          & cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --locked --features smoke-test -- --test-threads=1 2>&1 | Tee-Object .agent-runtime/windows-rust.log
          $nativeStatus = $LASTEXITCODE
          if ($nativeStatus -ne 0) {
            $log = Get-Content .agent-runtime/windows-rust.log -Raw
            $tail = $log.Substring([Math]::Max(0, $log.Length - 6500))
            for ($at = 0; $at -lt $tail.Length; $at += 1000) {
              $part = $tail.Substring($at, [Math]::Min(1000, $tail.Length - $at)).Replace('%','%25').Replace("`r",'%0D').Replace("`n",'%0A')
              Write-Output "::error title=Windows native diagnostic::$part"
            }
          }
          exit $nativeStatus
      - name: Build native probe
        run: cargo build --manifest-path apps/desktop/src-tauri/Cargo.toml --locked --features smoke-test
      - name: Hidden recording and restart replay
        env:
          NATIVE_CLIENT_EXECUTABLE: ${{ github.workspace }}\apps\desktop\src-tauri\target\debug\tts-client.exe
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          & node scripts/test-native-client.mjs .agent-runtime/windows-native.json 2>&1 | Tee-Object .agent-runtime/windows-probe.log
          $probeStatus = $LASTEXITCODE
          if ($probeStatus -ne 0) {
            $log = Get-Content .agent-runtime/windows-probe.log -Raw
            $log = [regex]::Replace($log, '(?im)^.*(?:authorization|cookie|api.?key|password).*$','[redacted diagnostic line]')
            $tail = $log.Substring([Math]::Max(0, $log.Length - 6500))
            for ($at = 0; $at -lt $tail.Length; $at += 1000) {
              $part = $tail.Substring($at, [Math]::Min(1000, $tail.Length - $at)).Replace('%','%25').Replace("`r",'%0D').Replace("`n",'%0A')
              Write-Output "::error title=Windows probe diagnostic::$part"
            }
          }
          exit $probeStatus
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: windows-native-${{ github.sha }}
          path: .agent-runtime/windows-native.json
          if-no-files-found: ignore
      - name: Build and verify Windows preview installer
        timeout-minutes: 30
        env:
          TTS_RELEASE_SOURCE_REF: ${{ github.sha }}
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          & npm run release:windows:preview 2>&1 | Tee-Object .agent-runtime/windows-package.log
          $status = $LASTEXITCODE
          if ($status -ne 0) {
            $log = (Get-Content .agent-runtime/windows-package.log | Where-Object { $_ -notmatch '(?i)authorization|bearer |password|api[_-]?key|cookie|::notice title=LingJi installer ' }) -join "`n"
            $tail = $log.Substring([Math]::Max(0,$log.Length-7500))
            for ($at=0;$at -lt $tail.Length;$at+=1000) {
              $part=$tail.Substring($at,[Math]::Min(1000,$tail.Length-$at)).Replace('%','%25').Replace("`r",'%0D').Replace("`n",'%0A')
              Write-Output "::error title=Windows package diagnostic::$part"
            }
          }
          exit $status
      - name: Inspect installer welcome screenshot
        if: ${{ always() }}
        run: node scripts/expose-installer-screen.mjs welcome
      - name: Inspect installer directory screenshot
        if: ${{ always() }}
        run: node scripts/expose-installer-screen.mjs settings
      - name: Inspect installer installing screenshot
        if: ${{ always() }}
        run: node scripts/expose-installer-screen.mjs installing
      - name: Inspect installer finish screenshot
        if: ${{ always() }}
        run: node scripts/expose-installer-screen.mjs finish
      - name: Inspect installer unexpected screenshot
        if: ${{ always() }}
        run: node scripts/expose-installer-screen.mjs unexpected
      - name: Save Windows Rust dependency cache
        if: ${{ always() && !cancelled() && steps.rust_cache.outcome == 'success' && steps.rust_cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/desktop/src-tauri/target/debug/deps
            apps/desktop/src-tauri/target/debug/build
            apps/desktop/src-tauri/target/debug/.fingerprint
            apps/desktop/src-tauri/target/release/deps
            apps/desktop/src-tauri/target/release/build
            apps/desktop/src-tauri/target/release/.fingerprint
          key: ${{ steps.rust_cache.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: windows-candidate-${{ github.sha }}
          path: |
            dist/releases/**
            .agent-runtime/installer-ui/**
            .agent-runtime/windows-native.json
          if-no-files-found: warn
          retention-days: 7
