# Proposal only. Remote diagnostic branch and CI execution await user approval.
name: Native CI diagnostic
on:
  push:
    branches: [dev_native-ci-diagnostics]
permissions:
  contents: read
jobs:
  native:
    runs-on: macos-15-arm64
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24.21.0'
      - run: rustup toolchain install 1.92.0 --profile minimal && rustup default 1.92.0
      - run: npm ci
      - run: node scripts/prepare-client-backend.mjs && npm run build:web
      - name: Native diagnostics
        run: |
          mkdir -p .agent-runtime
          set +e
          cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --locked --features smoke-test -- --test-threads=1 2>&1 | tee .agent-runtime/native-ci-tests.log
          native_status=${PIPESTATUS[0]}
          set -e
          if [[ "$native_status" -ne 0 ]]; then
            node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const tail = readFileSync('.agent-runtime/native-ci-tests.log', 'utf8').slice(-18000);
          const blocks = tail.match(/[\s\S]{1,1000}/g) || [];
          for (const [index, block] of blocks.entries()) {
            const message = block.replaceAll('%', '%25').replaceAll('\r', '%0D').replaceAll('\n', '%0A');
            console.log(`::error title=Native diagnostic ${index + 1}/${blocks.length}::${message}`);
          }
          NODE
          fi
          exit "$native_status"
